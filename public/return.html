<!doctype html>
    <html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>付款状态 | Northstar Locate</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #182230; background: #f6f8fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); background: #fff; border: 1px solid #dce2ea; border-radius: 8px; padding: 28px; }
      #status { line-height: 1.5; }
      .success { color: #147a4b; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1>付款状态</h1>
      <p id="status">正在确认付款状态…</p>
    </main>
    <script>
      const statusNode = document.querySelector('#status');
      const params = new URLSearchParams(window.location.search);
      const paymentIntentId = params.get('payment_intent');
      const sessionId = params.get('session_id');

      async function loadStatus() {
        if (paymentIntentId) {
          try {
            const response = await fetch(`/api/payment-intent-status?payment_intent_id=${encodeURIComponent(paymentIntentId)}`);
            const body = await response.json();
            if (!response.ok) throw new Error(body.error || `Request failed (${response.status})`);
            if (body.status === 'succeeded') {
              statusNode.textContent = '付款成功，感谢你的支持。';
              statusNode.className = 'success';
            } else {
              statusNode.textContent = `付款状态：${body.status || '处理中'}。`;
            }
          } catch (error) {
            statusNode.textContent = error.message;
            statusNode.className = 'error';
          }
          return;
        }
        if (!sessionId) {
          statusNode.textContent = '缺少付款编号。';
          statusNode.className = 'error';
          return;
        }
        try {
          const response = await fetch(`/api/session-status?session_id=${encodeURIComponent(sessionId)}`);
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || `Request failed (${response.status})`);
          if (body.paymentStatus === 'paid') {
            statusNode.textContent = '付款成功，感谢你的支持。';
            statusNode.className = 'success';
          } else {
            statusNode.textContent = `付款状态：${body.paymentStatus || body.status || '处理中'}。`;
          }
        } catch (error) {
          statusNode.textContent = error.message;
          statusNode.className = 'error';
        }
      }

      loadStatus();
    </script>
  </body>
</html>
