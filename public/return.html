<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>付款状态 | Northstar Locate</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #182230; background: #f6f8fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); background: #fff; border: 1px solid #dce2ea; border-radius: 8px; padding: 28px; }
      #status { line-height: 1.5; }
      .success { color: #147a4b; }
      .error { color: #b42318; }
      a { color: #2f68f5; }
    </style>
  </head>
  <body>
    <main>
      <h1>付款状态</h1>
      <p id="status">正在确认付款状态…</p>
      <p><a href="/">返回 Northstar Locate</a></p>
    </main>
    <script>
      const statusNode = document.querySelector('#status');
      const params = new URLSearchParams(window.location.search);
      const paymentId = params.get('payment');
      const status = params.get('status');

      if (status === 'succeeded') {
        statusNode.textContent = paymentId ? `付款成功（${paymentId}），订阅状态将在服务器确认后更新。` : '付款成功，订阅状态将在服务器确认后更新。';
        statusNode.className = 'success';
      } else if (status === 'failed' || status === 'canceled') {
        statusNode.textContent = '付款未完成，没有扣款。请返回价格页面重试。';
        statusNode.className = 'error';
      } else {
        statusNode.textContent = '付款仍在处理中，服务器确认后会更新账号状态。';
      }
    </script>
  </body>
</html>
