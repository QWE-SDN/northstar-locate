<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="admin.title">账号后台 · Northstar Locate</title>
    <script src="/locales.js?v=20261029-1"></script>
    <script src="/i18n.js?v=20261029-1"></script>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #182230; background: #f6f8fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px max(20px, calc((100% - 1120px) / 2)); border-bottom: 1px solid #dce2ea; background: #fff; }
      header strong { font-size: 20px; }
      header a { color: #2f68f5; text-decoration: none; }
      main { width: min(1120px, calc(100% - 40px)); margin: 44px auto; }
      .panel { padding: 28px; border: 1px solid #dce2ea; border-radius: 10px; background: #fff; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { color: #66728b; line-height: 1.6; }
      form { display: grid; gap: 14px; max-width: 390px; margin-top: 22px; }
      label { display: grid; gap: 7px; color: #182230; font-size: 13px; font-weight: 700; }
      input { border: 1px solid #dce2ea; border-radius: 6px; padding: 12px; font: inherit; }
      button { border: 0; border-radius: 7px; padding: 12px 16px; background: #2f68f5; color: #fff; font-weight: 800; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #message { min-height: 20px; color: #b42318; }
      #dashboard[hidden], #login[hidden] { display: none; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
      .toolbar h1 { margin: 0; }
      .toolbar button { background: #fff; border: 1px solid #2f68f5; color: #2f68f5; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 720px; }
      th, td { padding: 13px 12px; border-bottom: 1px solid #e7ebf0; text-align: left; font-size: 13px; }
      th { color: #66728b; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
      .active { color: #147a4b; font-weight: 800; }
      .inactive, .payment_failed, .canceled { color: #b42318; }
      @media (max-width: 620px) { main { width: min(100% - 28px, 1120px); margin: 28px auto; } .panel { padding: 22px; } header { padding: 18px 14px; } }
      .language { max-width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #d9e4ef; border-radius: 8px; background: #fff; color: #14234a; font: inherit; font-size: 13px; cursor: pointer; }
      .language:focus-visible { outline: 3px solid #91b4ff; outline-offset: 2px; }
      [hidden] { display: none !important; }
      h1, h2, h3, p, button, summary { overflow-wrap: break-word; }
      header { flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header><strong><span data-i18n="admin.heading">Northstar Locate · 账号后台</span></strong><a href="/" data-language-link><span data-i18n="admin.back">返回网站</span></a><select class="language" data-language-select data-i18n-aria-label="nav.language" aria-label="选择语言"><option value="zh-CN">Language</option></select></header>
    <main>
      <div id="message" role="alert"></div>
      <section class="panel" id="login">
        <h1><span data-i18n="admin.loginTitle">管理员登录</span></h1>
        <p><span data-i18n="admin.hint">输入你的后台密码。</span></p>
        <form id="login-form"><label><span data-i18n="admin.password">后台密码</span><input id="password" type="password" autocomplete="current-password" required></label><button id="login-button" type="submit"><span data-i18n="admin.login">登录后台</span></button></form>
      </section>
      <section class="panel" id="dashboard" hidden>
        <div class="toolbar"><h1><span data-i18n="admin.users">用户与订阅</span></h1><button id="refresh" type="button"><span data-i18n="admin.refresh">刷新</span></button></div>
        <div class="table-wrap"><table><thead><tr><th><span data-i18n="admin.email">邮箱</span></th><th><span data-i18n="admin.status">订阅状态</span></th><th><span data-i18n="admin.plan">方案</span></th><th><span data-i18n="admin.paymentId">Whop payment ID</span></th><th><span data-i18n="admin.created">注册时间</span></th></tr></thead><tbody id="users"></tbody></table></div>
        <p id="empty" hidden><span data-i18n="admin.empty">还没有注册用户。</span></p>
      </section>
    </main>
    <script>
      const I = window.NorthstarI18n;
      const t = I.t;
      const login = document.querySelector('#login');
      const dashboard = document.querySelector('#dashboard');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const message = document.querySelector('#message');
      const usersNode = document.querySelector('#users');
      const empty = document.querySelector('#empty');

      async function api(url, options = {}) {
        const response = await fetch(url, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', 'Accept-Language': I.language, ...(options.headers || {}) } });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(body.error || '');
          error.status = response.status;
          if (!body.error) error.i18nKey = 'error.request';
          throw error;
        }
        return body;
      }

      function date(value) {
        return value ? new Date(Number(value) * 1000).toLocaleString(I.language) : '—';
      }

      let cachedUsers = [];
      function renderUsers() {
        usersNode.replaceChildren();
        empty.hidden = cachedUsers.length > 0;
        cachedUsers.forEach((user) => {
          const row = document.createElement('tr');
          row.innerHTML = '<td></td><td></td><td></td><td></td><td></td>';
          const state = user.subscriptionStatus || 'inactive';
          row.children[1].className = ['active', 'inactive', 'payment_failed', 'canceled'].includes(state) ? state : '';
          row.children[0].textContent = user.email;
          I.set(row.children[1], ['active', 'inactive', 'payment_failed', 'canceled', 'past_due', 'trialing'].includes(state) ? `status.${state}` : 'status.unknown');
          if (['monthly', 'yearly'].includes(user.subscriptionPlan)) I.set(row.children[2], `plan.${user.subscriptionPlan}`);
          else row.children[2].textContent = '—';
          row.children[3].textContent = user.whopPaymentId || '—';
          row.children[4].textContent = date(user.createdAt);
          usersNode.append(row);
        });
      }

      async function loadUsers() {
        const body = await api('/api/admin/users', { headers: {} });
        cachedUsers = body.users;
        renderUsers();
      }
      I.onChange(renderUsers);

      async function showDashboard() {
        try {
          await loadUsers();
          login.hidden = true;
          dashboard.hidden = false;
        } catch (error) {
          I.showError(message, error, 'error.account');
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginButton.disabled = true;
        I.clear(message);
        try {
          await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: document.querySelector('#password').value }) });
          document.querySelector('#password').value = '';
          await showDashboard();
        } catch (error) {
          I.showError(message, error, 'error.account');
        } finally {
          loginButton.disabled = false;
        }
      });
      document.querySelector('#refresh').addEventListener('click', () => loadUsers().catch((error) => { I.showError(message, error, 'error.account'); }));
    </script>
  </body>
</html>
