<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>账号后台 | Northstar Locate</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #182230; background: #f6f8fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px max(20px, calc((100% - 1120px) / 2)); border-bottom: 1px solid #dce2ea; background: #fff; }
      header strong { font-size: 20px; }
      header a { color: #2f68f5; text-decoration: none; }
      main { width: min(1120px, calc(100% - 40px)); margin: 44px auto; }
      .panel { padding: 28px; border: 1px solid #dce2ea; border-radius: 10px; background: #fff; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { color: #66728b; line-height: 1.6; }
      form { display: grid; gap: 14px; max-width: 390px; margin-top: 22px; }
      label { display: grid; gap: 7px; color: #182230; font-size: 13px; font-weight: 700; }
      input { border: 1px solid #dce2ea; border-radius: 6px; padding: 12px; font: inherit; }
      button { border: 0; border-radius: 7px; padding: 12px 16px; background: #2f68f5; color: #fff; font-weight: 800; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #message { min-height: 20px; color: #b42318; }
      #dashboard[hidden], #login[hidden] { display: none; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
      .toolbar h1 { margin: 0; }
      .toolbar button { background: #fff; border: 1px solid #2f68f5; color: #2f68f5; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 720px; }
      th, td { padding: 13px 12px; border-bottom: 1px solid #e7ebf0; text-align: left; font-size: 13px; }
      th { color: #66728b; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
      .active { color: #147a4b; font-weight: 800; }
      .inactive, .payment_failed, .canceled { color: #b42318; }
      @media (max-width: 620px) { main { width: min(100% - 28px, 1120px); margin: 28px auto; } .panel { padding: 22px; } header { padding: 18px 14px; } }
    </style>
  </head>
  <body>
    <header><strong>Northstar Locate · 账号后台</strong><a href="/">返回网站</a></header>
    <main>
      <section class="panel" id="login">
        <h1>管理员登录</h1>
        <p>输入 Render Environment 中设置的 ADMIN_PASSWORD。</p>
        <form id="login-form"><label>后台密码<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button" type="submit">登录后台</button><div id="message" role="alert"></div></form>
      </section>
      <section class="panel" id="dashboard" hidden>
        <div class="toolbar"><h1>用户与订阅</h1><button id="refresh" type="button">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>邮箱</th><th>订阅状态</th><th>方案</th><th>Whop payment ID</th><th>注册时间</th></tr></thead><tbody id="users"></tbody></table></div>
        <p id="empty" hidden>还没有注册用户。</p>
      </section>
    </main>
    <script>
      const login = document.querySelector('#login');
      const dashboard = document.querySelector('#dashboard');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const message = document.querySelector('#message');
      const usersNode = document.querySelector('#users');
      const empty = document.querySelector('#empty');

      async function api(url, options = {}) {
        const response = await fetch(url, { credentials: 'same-origin', ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `请求失败（${response.status}）`);
        return body;
      }

      function date(value) {
        return value ? new Date(Number(value) * 1000).toLocaleString() : '—';
      }

      async function loadUsers() {
        const body = await api('/api/admin/users', { headers: {} });
        usersNode.replaceChildren();
        empty.hidden = body.users.length > 0;
        body.users.forEach((user) => {
          const row = document.createElement('tr');
          row.innerHTML = `<td></td><td class="${user.subscriptionStatus || 'inactive'}"></td><td></td><td></td><td></td>`;
          row.children[0].textContent = user.email;
          row.children[1].textContent = user.subscriptionStatus || 'inactive';
          row.children[2].textContent = user.subscriptionPlan || '—';
          row.children[3].textContent = user.whopPaymentId || '—';
          row.children[4].textContent = date(user.createdAt);
          usersNode.append(row);
        });
      }

      async function showDashboard() {
        try {
          await loadUsers();
          login.hidden = true;
          dashboard.hidden = false;
        } catch (error) {
          if (!String(error.message).includes('401')) message.textContent = error.message;
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginButton.disabled = true;
        message.textContent = '';
        try {
          await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: document.querySelector('#password').value }) });
          document.querySelector('#password').value = '';
          await showDashboard();
        } catch (error) {
          message.textContent = error.message;
        } finally {
          loginButton.disabled = false;
        }
      });
      document.querySelector('#refresh').addEventListener('click', () => loadUsers().catch((error) => { message.textContent = error.message; }));
    </script>
  </body>
</html>
